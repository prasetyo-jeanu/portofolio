services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4321:4321"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "4321"
      SITE_URL: ${SITE_URL:-http://localhost:4321}
      DATABASE_PATH: /data/portfolio.db
      UPLOAD_DIR: /data/uploads
      PUBLIC_DIST_DIR: /data/dist-public
      SESSION_SECRET: ${SESSION_SECRET:-change-this-to-a-long-random-hex-secret-at-least-32-chars}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMeStrongPassword123!}
      ADMIN_NAME: ${ADMIN_NAME:-Developer Admin}
    volumes:
      - portfolio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:4321/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  portfolio_data:
